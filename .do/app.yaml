# DigitalOcean App Platform spec: free static frontend + ~$5/month API container,
# both on one domain (/api → backend, everything else → frontend). Data lives in Turso.
#
# Create it: DO dashboard → Apps → Create App → GitHub repo (it picks up this file),
# or with the CLI: doctl apps create --spec .do/app.yaml
# Then fill in the three secrets under Settings → api → Environment Variables.
name: jellyfish
region: blr

static_sites:
  - name: web
    github:
      repo: kokoonlabsai/Expense
      branch: main
      deploy_on_push: true
    source_dir: client
    build_command: npm ci && npm run build
    output_dir: dist
    catchall_document: index.html   # lets React Router handle /transactions, /splits, …

services:
  - name: api
    github:
      repo: kokoonlabsai/Expense
      branch: main
      deploy_on_push: true
    source_dir: server
    dockerfile_path: server/Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /api/health
    envs:
      - key: TZ                     # your time zone — decides what "today" and "this month" mean
        value: Asia/Kolkata
      - key: JWT_SECRET
        type: SECRET
        value: change-me-to-a-long-random-string
      - key: TURSO_DATABASE_URL
        type: SECRET
        value: libsql://your-db-name.turso.io
      - key: TURSO_AUTH_TOKEN
        type: SECRET
        value: your-turso-auth-token

ingress:
  rules:
    - component:
        name: api
        preserve_path_prefix: true
      match:
        path:
          prefix: /api
    - component:
        name: web
      match:
        path:
          prefix: /
